import androidx.build.AndroidXRootPlugin
import androidx.build.SdkHelperKt

buildscript {
    SdkHelperKt.setSupportRootFolder(project, project.projectDir)
    SdkHelperKt.writeSdkPathToLocalPropertiesFile(project)

    // Needed for atomicfu plugin
    apply(from: "buildSrc/repos.gradle")
    repos.addMavenRepositories(repositories)
    dependencies {
        classpath(libs.atomicFuPluginz)
        // This should be removed once https://github.com/Kotlin/kotlinx-atomicfu/issues/399 is fixed
        classpath("org.jetbrains.kotlin:atomicfu:${libs.versions.kotlin.get()}")
    }
}

apply from: "buildSrc/dependencies.gradle"

apply plugin: AndroidXRootPlugin

// workaround for https://github.com/gradle/gradle/issues/24822
if (project.hasProperty("androidx.update.signatures")) {
    apply plugin: "java-library"
    apply from: "buildSrc/shared-dependencies.gradle"
}

allprojects {
    this.tasks.configureEach {
        if (it.name == "kotlinStoreYarnLock") it.enabled = false
    }
    it.configurations {
        configureEach {
            resolutionStrategy {
                eachDependency {
                    if (requested.group == "org.jetbrains.kotlinx" && requested.module.name.startsWith("kotlinx-coroutines")) {
                        useTarget("com.vickyleu.kotlinx.coroutines:${requested.module.name}:1.10.1-SNAPSHOT")
                    } else if (requested.group == "org.jetbrains.kotlinx" && requested.module.name.startsWith("kotlinx-html")) {
                        useTarget("com.vickyleu.kotlinx:${requested.module.name}:0.12.0")
                    } else if (requested.group == "org.jetbrains.kotlinx" && (requested.module.name.startsWith("kotlinx-rpc") &&
                            requested.module.name != "kotlinx-rpc-bom" &&
                            requested.module.name.startsWith("kotlinx-rpc-compiler").not())) {
                        useTarget("com.vickyleu.kotlinx:${requested.module.name}:0.5.1")
                    } else if (requested.group == "io.ktor" && requested.module.name.startsWith("ktor")) {
                        useTarget("com.vickyleu.ktor:${requested.module.name}:3.1.2-SNAPSHOT")
                    } else if (requested.group == "pro.streem.pbandk") {
                        useTarget("com.vickyleu.pbandk:${requested.module.name}:0.16.1-SNAPSHOT")
                    } else if (requested.group == "io.github.oshai") {
                        useTarget("com.vickyleu.oshai:${requested.module.name}:7.0.6")
                    }
                }
            }
        }
    }
}